"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
[](bg:bright-blue fg:blue)\
$directory\
[](fg:bright-blue bg:cyan)\
$git_branch\
$git_status\
[](fg:cyan bg:yellow)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:yellow bg:bright-blue)\
$docker_context\
$conda\
[](fg:bright-blue bg:blue)\
$time\
[ ](fg:blue)\
$line_break$character"""

[os]
disabled = false
style = "bg:blue fg:black"
format = '[ $symbol]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
NixOS = "󱄅"

[username]
show_always = true
style_user = "bg:blue fg:black"
style_root = "bg:blue fg:red"
format = '[ $user ]($style)'

[directory]
style = "fg:black bg:bright-blue"
format = "[ 󰝰 $path ]($style)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol $branch ](fg:black bg:cyan)]($style)'

[git_status]
style = "bg:cyan"
format = '[[($all_status$ahead_behind )](fg:black bg:cyan)]($style)'

[nodejs]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[c]
symbol = " "
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[rust]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[golang]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[php]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[java]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[kotlin]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[haskell]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[python]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol( $version) ](fg:black bg:yellow)]($style)'

[docker_context]
symbol = ""
style = "bg:bright-blue"
format = '[[ $symbol( $context) ](fg:black bg:bright-blue)]($style)'

[conda]
style = "bg:bright-blue"
format = '[[ $symbol( $context) ](fg:black bg:bright-blue)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:blue"
format = '[[  $time ](fg:black bg:blue)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:white)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:color_11)'
vimcmd_replace_one_symbol = '[](bold fg:color_14)'
vimcmd_replace_symbol = '[](bold fg:color_14)'
vimcmd_visual_symbol = '[](bold fg:color_10)'
